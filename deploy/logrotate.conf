# ── VurnChat Server — logrotate configuration ───────────────────────
# Source: https://github.com/scramble22/VurnChat
#
# vurn-server writes all logs to journald (via tracing-subscriber),
# so this config handles journald log sizing automatically.
#
# No separate log file needs rotation. This file exists as a placeholder
# in case file-based logging is enabled in the future.
#
# Install:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/vurn

/var/log/vurn/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
    maxsize 100M
}
