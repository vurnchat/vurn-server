[package]
name = "vurn-core"
version = "0.6.0"
edition = "2021"
description = "Post-quantum cryptographic core of the VurnChat messenger"
license = "MIT OR Apache-2.0"

[dependencies]
ml-kem = { version = "0.2", features = ["std", "zeroize"] }
aes-gcm = "0.10"
rand = { version = "0.8", features = ["getrandom"] }
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
hex = "0.4"
