[package]
name = "vurn-server"
version = "0.6.0"
edition = "2021"
description = "Blind WebSocket relay server for the VurnChat messenger"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
futures = "0.3"

# libp2p v0.56 for P2P networking
libp2p = { version = "0.56", default-features = false, features = [
    "tokio", "tcp", "dns", "noise", "yamux",
    "kad", "gossipsub", "identify", "ping", "macros",
    "relay", "dcutr",
] }

# Embedded database for local mailbox backup
sled = "0.34"

# Ed25519 signing for DhtEnvelope Zero-Trust
ed25519-dalek = "2"

# Binary serialization for DhtEnvelope
bincode = "1"

# TLS / WSS support
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.4"
