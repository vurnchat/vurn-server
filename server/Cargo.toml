[package]
name = "vurn-server"
version = "0.1.0"
edition = "2021"
description = "Blind WebSocket relay server for the VurnChat messenger"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
futures = "0.3"

# libp2p v0.56 for P2P networking
libp2p = { version = "0.56", default-features = false, features = [
    "tokio", "tcp", "dns", "noise", "yamux",
    "kad", "gossipsub", "identify", "ping", "macros",
] }
