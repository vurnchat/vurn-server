[package]
name = "vurn-server"
version = "0.1.0"
edition = "2021"
description = "Blind WebSocket relay server for the VurnChat messenger"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
tower-service = "0.3"
