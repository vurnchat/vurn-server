[workspace]
members = [
    "core",
    "server",
]

resolver = "2"

[workspace.package]
version = "0.6.6"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vurnchat/vurn-server"
authors = ["VurnChat Contributors"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
