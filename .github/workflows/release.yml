name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run all tests
        run: cargo test -p vurn-core -p vurn-server -- --nocapture

  build:
    name: Build vurn-server (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            strip: strip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            strip: aarch64-linux-gnu-strip
          - target: x86_64-apple-darwin
            os: macos-latest
            strip: strip
          - target: aarch64-apple-darwin
            os: macos-latest
            strip: strip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          cargo build -p vurn-server --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          ${{ matrix.strip }} "target/${{ matrix.target }}/release/vurn-server" 2>/dev/null || true

      - name: Smoke test
        run: |
          BIN="target/${{ matrix.target }}/release/vurn-server"
          file "$BIN"
          "$BIN" --help 2>&1 | head -5
          # Quick sanity: start and kill (just verify it binds)
          timeout 3 "$BIN" --port 19999 2>&1 || true

      - name: Rename binary for release
        run: |
          mv "target/${{ matrix.target }}/release/vurn-server" \
             "vurn-server-${{ matrix.target }}"

      - name: Generate checksum
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "vurn-server-${{ matrix.target }}" \
              > "vurn-server-${{ matrix.target }}.sha256"
          else
            shasum -a 256 "vurn-server-${{ matrix.target }}" \
              > "vurn-server-${{ matrix.target }}.sha256"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vurn-server-${{ matrix.target }}
          path: |
            vurn-server-${{ matrix.target }}
            vurn-server-${{ matrix.target }}.sha256
          compression-level: 0

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        run: ls -lh

      - name: Verify checksums
        run: |
          for f in vurn-server-*.sha256; do
            echo "Verifying $f..."
            sha256sum -c "$f"
          done

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          cat <<NOTES > release_notes.md
          ## VurnChat Blind Relay Server ${VERSION}

          ### Installation

          **Quick install (Linux):**
          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/vurnchat/vurn-server/${TAG}/install.sh | bash
          \`\`\`

          Or download the binary for your architecture below and run:
          \`\`\`bash
          chmod +x vurn-server-*
          ./vurn-server-* --help
          \`\`\`

          ### Quick Start

          \`\`\`bash
          # Plain WS
          ./vurn-server-x86_64-unknown-linux-gnu --port 9000

          # WSS with TLS
          ./vurn-server-x86_64-unknown-linux-gnu --port 443 --cert cert.pem --key key.pem
          \`\`\`

          ### Links
          - [Source Code](https://github.com/vurnchat/vurn-server)
          - [Documentation](https://github.com/vurnchat/vurn-server#readme)
          - [Web Client](https://github.com/vurnchat/vurn-web)
          NOTES

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            vurn-server-x86_64-unknown-linux-gnu
            vurn-server-x86_64-unknown-linux-gnu.sha256
            vurn-server-aarch64-unknown-linux-gnu
            vurn-server-aarch64-unknown-linux-gnu.sha256
            vurn-server-x86_64-apple-darwin
            vurn-server-x86_64-apple-darwin.sha256
            vurn-server-aarch64-apple-darwin
            vurn-server-aarch64-apple-darwin.sha256
